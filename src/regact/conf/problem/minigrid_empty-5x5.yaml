# A single MiniGrid task (Empty-5x5) — the fastest end-to-end smoke, using the
# Gym environment ID that Regact uses as the task name.
name: minigrid
tasks:
  - MiniGrid-Empty-5x5-v0
lifecycle: multi_instance
obs_mode: raw
info_mode: informative
seed: null              # null = the env's own default seeding
kwargs:
  fully_obs: true

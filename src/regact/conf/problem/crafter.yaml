name: crafter
tasks: []               # every task below
lifecycle: single_instance
obs_mode: raw
info_mode: informative
seed: null              # ignored: a task's maps come from its name
kwargs:
  seeds: [0, 1, 2, 3, 4]     # seeded tasks crafter_s<seed>: every life on that map
  unseeded: [0, 1, 2, 3, 4]  # unseeded tasks crafter_u<k>: every life on a new map
  # Frozen evaluation when an unseeded task ends: its final controller plays one life per map
  # below. 10 episodes of at most 2000 steps is BALROG's Crafter setting.
  eval_seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  eval_max_actions: 2000

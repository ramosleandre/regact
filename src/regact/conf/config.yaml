# Default run config. Compose the four agnosticity axes as Hydra groups, and override
# any field on the CLI:
#   python -m regact.run_exp agent=claude problem=arc_agi
#   python -m regact.run_exp agent=codex problem=minigrid agent.args.reasoning_effort=high
#   python -m regact.run_exp experiment=research        # a whole profile (agent+problem+limits+…)
defaults:
  - agent: scripted        # conf/agent/*        — who writes the code
  - problem: arc_agi       # conf/problem/*      — the environment (iterates its tasks)
  - features: controller   # conf/features/*     — the agent-built capabilities
  - _self_
  - optional experiment:   # conf/experiment/*   — a named profile that overrides the above

parallel_workers: 1     # concurrent tasks; 1 = sequential
limits:
  max_turns: 350                # agent turns per task before the loop gives up
  max_seconds_per_task: null    # wall-clock per task, from session start; null = no limit
  max_actions_per_env: null     # env.step cap per env instance, from its make (anti-runaway);
                                # null = no cap
sandbox: true           # true = confine the agent (backend auto-detected) + block egress except its
                        # LLM hosts; the run FAILS rather than proceed unconfined. false = off.
                        # Force a backend with +sandbox_opts.backend=<seatbelt|bwrap|apptainer>
                        # (+sandbox_opts.image=<.sif> for apptainer).
output_root: experiments
experiment_name: dev

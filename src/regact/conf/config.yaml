# Default run config. Compose the Hydra groups and override
# any field on the CLI:
#   python -m regact.run_exp agent=claude problem=arc_agi
#   python -m regact.run_exp agent=codex problem=minigrid agent.args.reasoning_effort=high
#   python -m regact.run_exp experiment=research        # a whole profile (agent+problem+limits+…)
defaults:
  - agent: scripted        # conf/agent/*        — who writes the code
  - problem: arc_agi       # conf/problem/*      — the environment (iterates its tasks)
  - protocol: policy_search # conf/protocol/*     - experiment workflow
  - controller: default    # conf/controller/*   - policy-search evaluation knobs
  - features: none         # conf/features/*     - optional policy-search capabilities
  - _self_
  - optional model:        # conf/model/*        — a served model's pinned hyperparameters (ctx window…)
  - optional experiment:   # conf/experiment/*   — a named profile that overrides the above
  # Prevent Hydra logging
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

parallel_workers: 1     # concurrent tasks; 1 = sequential
n_attempts_per_task: 1  # repeat each task N times (interleaved) to aggregate over attempts; 1 = once
first_obs_in_prompt: false  # true = render the first observation into the first message
flagging_warning_cap: 3  # after completed tools (CLI: next outer turn); 0 disables messages
dry_run: false  # prompt-only: write the prompt + first message to the run and exit (no agent, no cost)
limits:  # every max_* accepts null to disable its cap
  max_turns_per_task: 350                # agent turns per task before the loop gives up
  max_turns: null               # deprecated alias of max_turns_per_task (old launchers)
  max_tool_calls: null          # total tool calls across the run (the primary budget); null = off
  max_seconds_per_task: null    # wall-clock per task, from session start; null = no limit
  deadline_unix: null           # absolute task end (UNIX s), e.g. job end - margin; caps the above
  max_actions_per_task: null # vanilla/CWM only: total real steps across collection and calls
  max_actions_per_episode: null     # env.step cap per episode; reset renews this budget;
                                # null = no cap
  max_consecutive_no_tool_turns: 15  # >0 = end the loop after N consecutive REGACT TURNS
                                # (= send cycles, NOT model calls: a subprocess agent runs ~5
                                # internal iterations per turn, so N turns is ~5N wasted calls)
                                # with no tool call; doom-loop breaker; 0 = off
sandbox: true           # true = confine the agent (backend auto-detected: bwrap on Linux,
                        # seatbelt on macOS) + block egress except its LLM hosts; the run FAILS
                        # rather than proceed unconfined. false = off.
                        # Force a backend with +sandbox_opts.backend=<seatbelt|bwrap>.
output_root: experiments
experiment_name: dev

# Prevent Hydra `outputs` subdir creation
hydra:
  output_subdir: null
  run:
    dir: .

# Every max_* option accepts null to disable that particular cap.
# CWM v6. Settings apply only with protocol=cwm.
name: cwm
n_unique_observations_in_initial_collection: 1  # 1 = start from the first observation, no random actions
max_actions_per_initial_collection: 1000
max_seconds_per_initial_collection: 30
threshold_max_state_obs_size_ratio: 0.5
check_animation_frames: false  # false: the CWM predicts problem.settled_observation (ARC: last frame)
max_actions_per_RunController: 2500
# PNG previews per RunController; >0 needs agent.vision=true.
n_tmp_images_saved_per_exploration: 0
workspace_helpers_enabled: true
planner:
  enabled: false
  algorithm: bfs
  max_seconds_per_planner_call: 30
  max_cwm_calls_per_planner_call: 10000
  max_nodes_per_planner_call: 10000
  max_depth_per_planner_call: 100
# A second command of the same name in one agent tool call is refused.
one_command_per_tool_call: true
execution:
  max_seconds_per_call: 5
  max_seconds_per_UpdateCodeWorldModel: 90  # seconds of submitted code per validation, at least
  max_seconds_per_UpdateCodeWorldModel_per_1000_steps: 30  # more for long recorded runs
  max_seconds_per_RunController: 90  # < the agents' 120 s shell timeout
  max_memory_mb: 2048
feedback:
  max_counterexamples: 5
  max_diff_items: 6  # values listed per field
  max_diff_regions: 4  # regions listed per grid
  max_diff_changes: 4  # colour changes listed per region
  max_crop_cells: 64  # largest region shown as a crop
  max_error_chars: 1000
data_api:
  max_items: 100
  max_response_bytes: 2097152

# CWM v4. Settings apply only with protocol=cwm.
name: cwm
initial_unique_observations: 15
threshold_state_obs_size_ratio: 0.5
cwm_validation_policy: required
max_actions_per_exploration: 2500
planner:
  algorithm: bfs
  max_seconds_per_planner_call: 30
  max_cwm_calls_per_planner_call: 10000
  max_nodes_per_planner_call: 10000
  max_depth_per_planner_call: 100
execution:
  max_seconds_per_call: 5
  max_seconds_per_validation: 120
  max_seconds_per_rollout: 120
  max_memory_mb: 512
feedback:
  max_counterexamples: 5
  max_diff_items: 6
  max_error_chars: 1000
data_api:
  max_items: 100
  max_response_bytes: 2097152

# Observation-driven managed-controller baseline. All max_* accept null.
name: vanilla
n_unique_observations_in_initial_collection: 1  # 1 = start from the first observation, no random actions
max_actions_per_initial_collection: 1000
max_seconds_per_initial_collection: 30
max_actions_per_RunController: 2500
n_tmp_images_saved_per_exploration: 0  # >0 needs agent.vision=true
# A second command of the same name in one agent tool call is refused.
one_command_per_tool_call: true
execution:
  max_seconds_per_call: 5
  max_seconds_per_RunController: 90  # < the agents' 120 s shell timeout
  max_memory_mb: 2048
feedback:
  max_counterexamples: 5
  max_diff_items: 6
  max_error_chars: 1000
data_api:
  max_items: 100
  max_response_bytes: 2097152

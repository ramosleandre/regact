# @package _global_
# Research profile: a real run on offline ARC-AGI-3 with a coding-CLI agent, the
# anti-cheat defenses on (shadow-replay re-scores on a trusted env), and a video of
# the final controller.
#
#   python -m regact.run_exp experiment=research
#   python -m regact.run_exp experiment=research agent=codex 'problem.tasks=[ls20]'
#   python -m regact.run_exp experiment=research agent=claude agent.model=opus
#
# It SELECTS config groups (never re-writes their values), so a CLI `agent=codex` still
# overrides the choice below — the group's own args come from conf/agent/codex.yaml.
defaults:
  - override /agent: claude       # conf/agent/claude.yaml (model: opus, its args)
  - override /problem: arc_agi     # conf/problem/arc_agi.yaml (single_instance, offline)

# Experiment-specific fields only (not owned by any group):
sandbox: true             # confine the agent + block egress except its LLM host
controller:
  shadow_replay: true     # re-score by replaying the actions on a trusted env (~2x eval)
  n_videos: 2             # record a video of the first min(n_videos, n_episodes) episodes
limits:
  max_turns: 350
  max_seconds_per_task: 3600   # 1h per game
experiment_name: research

# @package _global_
# Dev profile: the fastest end-to-end run, no LLM (the scripted agent replays canned
# events). Exercises the whole loop → eval → artifacts pipeline. Use it to smoke-test
# plumbing changes.
#
#   python -m regact.run_exp experiment=dev
#
# SELECTS groups (a CLI `agent=...`/`problem=...` still overrides the choice below).
defaults:
  - override /agent: scripted
  - override /problem: arc_agi     # conf/problem/arc_agi.yaml (single_instance, offline)

# Experiment-specific fields only:
task_names: [ls20]        # one game, so the run is quick
security:
  sandbox: none           # dev convenience; no confinement
limits:
  keep_alive: 3
experiment_name: dev

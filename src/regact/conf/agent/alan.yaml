# Alan Code, driven in a CHILD process (so the OS sandbox applies to it) against an
# OpenAI-compatible endpoint (a local SimpleLM/SGLang/vLLM server on HPC, where the
# CLI agents' cloud APIs are unreachable). Framework tools reach it over the workdir
# control CLI.
#   agent=alan agent.model=openai/<MODEL_NAME> agent.base_url=http://127.0.0.1:9876/v1
# Remote-scripted mode (drive the model's responses by hand over HTTP):
#   agent=alan agent.model=remote +agent.args.backend=scripted
# Ending a remote session: a response containing ExitTask runs the tool, but Alan then
# opens another pending request carrying the tool result (normal tool-use protocol) —
# the run only tears down after a final TEXT-ONLY response with stop_reason=end_turn.
# Sequence: send ExitTask -> wait for the pending request -> send a closing text.
name: alan
model: null            # openai/<MODEL_NAME> (the served model); null = none
base_url: null         # http://127.0.0.1:9876/v1 (the SimpleLM/SGLang endpoint)
api_key: null          # any dummy for a local server (litellm requires one); null = use $OPENAI_API_KEY
args:
  permission_mode: yolo        # headless: no permission prompts
  max_output_tokens: 4096      # cap per completion — keeps small-context models (~32k) from overflowing
  memory: "off"                # no cross-run memory store
  context_window: null         # tell Alan its window (int); null = infer. Set for a local
                               # server (litellm can't fetch it offline; keep < max-model-len).
  # backend: scripted          # provider selection: auto (default) | anthropic-native | scripted
                               # (scripted + model=remote = HTTP-driven remote provider)

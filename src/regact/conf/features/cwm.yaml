# @package _global_
# The Code World Model feature: transitions recorded server-side (canonical in the run
# output dir, a mirror in the workdir), a world_model/ scaffold, and the agent-run
# verify.py coherence check. Override on the CLI as e.g.
# `features.cwm.max_tested_transitions_per_verify=500`.
#   python -m regact.run_exp features=cwm
# The controller is always-on core, so this run also has SubmitSolution/ExitTask (cwm just
# adds the world-model capability on top). Tune the controller via `controller.*`.
features:
  cwm:
    max_tested_transitions_per_verify: 1000               # verify.py default cap on distinct obs per run
    max_printed_incoherence_transitions_per_verify: 10    # verify.py default cap on failure details shown

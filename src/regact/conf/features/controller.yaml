# @package _global_
# The base feature set: just the controller (the agent writes a policy and submits it).
# A feature bundles workdir templates + a prompt fragment + tools + teardown hooks, and
# OWNS its knobs: run-level config never carries feature-specific fields. Override on
# the CLI as e.g. `features.controller.n_episodes=3`. Add a feature by creating another
# file here that adds its own `features.<name>:` entry (registered via register_feature).
features:
  controller:
    n_episodes: 1     # eval episodes per submission (multi-instance: more = better stats)
    max_moves: 2500   # max env.step per controller rollout (eval)

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="-20 -20 1080 540" role="img" aria-labelledby="rw-title rw-desc" focusable="false">
  <title id="rw-title">How a Regact run is organised</title>
  <desc id="rw-desc">A coding agent (Codex, Claude Code or Alan Code) works in a sandboxed workspace whose filesystem and network are confined. It writes a controller, and under cwm a world model, then calls framework commands over a localhost bridge. Regact runs the selected protocol, plain acting or cwm (a code world model), and executes the controller in an isolated process against the real problem: ARC-AGI-3, PuzzleScript, Baba Is You, MiniGrid or Sokoban. The conversation, tool calls, frames and world model are recorded, and the run can be replayed in the viewer.</desc>
  <style>
    .dg-box { fill: none; stroke: #b6bdc6; stroke-width: 1; }
    .dg-zone { fill: none; stroke: #b6bdc6; stroke-width: 1; stroke-dasharray: 5 4; }
    .dg-line { fill: none; stroke: #59636e; stroke-width: 1.25; }
    .dg-line.dash { stroke-dasharray: 4 4; }
    .dg-head { fill: #59636e; }
    .dg-cap, .dg-title, .dg-code, .dg-mono { font-family: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .dg-text, .dg-small { font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; }
    .dg-cap { font-size: 11px; letter-spacing: 0.08em; fill: #59636e; }
    .dg-cap.on, .dg-title, .dg-code { fill: #1f2328; }
    .dg-title { font-size: 14px; font-weight: 500; }
    .dg-text { font-size: 14px; fill: #31373d; }
    .dg-small { font-size: 12.5px; fill: #59636e; }
    .dg-code { font-size: 11.5px; }
    .pixel { image-rendering: pixelated; }
    .c3 { fill: #666666; } .c7 { fill: #FF7BCC; } .c9 { fill: #1E93FF; } .c11 { fill: #FFDC00; }
    .c12 { fill: #FF851B; } .c14 { fill: #4FCC30; }
    @media (prefers-color-scheme: dark) {
      .dg-box, .dg-zone { stroke: #3A3D46; }
      .dg-line { stroke: #A2A5AE; }
      .dg-head, .dg-cap, .dg-small { fill: #A2A5AE; }
      .dg-cap.on, .dg-title, .dg-code { fill: #E6E7EA; }
      .dg-text { fill: #CFD0D5; }
      .codex { filter: invert(1); }
    }
  </style>
  <defs>
    <marker id="rw-h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="dg-head" d="M0 0 8 4 0 8z"/></marker>
  </defs>

  <!-- sandbox -->
  <rect class="dg-zone" x="0.5" y="0.5" width="400" height="490"/>
  <text class="dg-cap on" x="18" y="28">SANDBOXED WORKSPACE</text>
  <text class="dg-small" x="18" y="48">OS sandbox: filesystem and network confined</text>

  <text class="dg-cap" x="18" y="88">CODING AGENT</text>
  <image class="codex" href="data:image/png;base64," x="20" y="104" width="30" height="30"/>
  <text class="dg-text" x="64" y="124">Codex</text>
  <image href="data:image/png;base64," x="18" y="146" width="34" height="34"/>
  <text class="dg-text" x="64" y="168">Claude Code</text>
  <image class="pixel" href="data:image/png;base64," x="18" y="190" width="34" height="34"/>
  <text class="dg-text" x="64" y="212">Alan Code</text>

  <path class="dg-line" d="M168 163.5H206" marker-end="url(#rw-h)"/>
  <text class="dg-small" x="172" y="155">writes</text>

  <text class="dg-cap" x="214" y="88">CODE</text>
  <rect class="dg-box" x="214.5" y="102.5" width="168" height="34"/><text class="dg-code" x="228" y="124">controller.py</text>
  <rect class="dg-box" x="214.5" y="146.5" width="168" height="34"/><text class="dg-code" x="228" y="168">world_model/</text>
  <text class="dg-small" x="214" y="200">under cwm</text>

  <rect class="dg-box" x="18.5" y="262.5" width="364" height="96"/>
  <text class="dg-cap" x="34" y="286">FRAMEWORK COMMANDS</text>
  <text class="dg-code" x="34" y="312">RunController</text>
  <text class="dg-code" x="34" y="334">UpdateCodeWorldModel</text>
  <text class="dg-small" x="244" y="312">run my controller</text>
  <text class="dg-small" x="244" y="334">validate my model</text>
  <path class="dg-line" d="M200 230V258" marker-end="url(#rw-h)"/>

  <text class="dg-small" x="18" y="452">game source hidden; internet blocked</text>
  <text class="dg-small" x="18" y="470">except the agent's own model API</text>

  <path class="dg-line" d="M383 310.5H456" marker-end="url(#rw-h)"/>
  <text class="dg-small" x="430" y="300" text-anchor="middle">localhost</text>

  <!-- framework -->
  <rect class="dg-box" x="460.5" y="20.5" width="260" height="330"/>
  <text class="dg-cap on" x="478" y="48">REGACT</text>
  <text class="dg-text" x="478" y="74">runs the protocol</text>
  <rect class="dg-box" x="478.5" y="88.5" width="224" height="32"/><rect class="c3" x="488" y="100" width="8" height="8"/>
  <text class="dg-code" x="506" y="109">vanilla</text><text class="dg-small" x="582" y="109">plain acting</text>
  <rect class="dg-box" x="478.5" y="128.5" width="224" height="32"/><rect class="c9" x="488" y="140" width="8" height="8"/>
  <text class="dg-code" x="506" y="149">cwm</text><text class="dg-small" x="582" y="149">model, then act</text>

  <rect class="dg-zone" x="478.5" y="190.5" width="224" height="140"/>
  <text class="dg-cap" x="494" y="214">ISOLATED PROCESS</text>
  <text class="dg-text" x="494" y="240">the controller, from a</text>
  <text class="dg-text" x="494" y="259">frozen copy of the code</text>
  <text class="dg-small" x="494" y="290">no workspace, no dataset,</text>
  <text class="dg-small" x="494" y="307">no network</text>

  <path class="dg-line" d="M713 230.5H796" marker-end="url(#rw-h)"/>
  <text class="dg-small" x="758" y="222" text-anchor="middle">actions</text>
  <path class="dg-line" d="M800 280.5H717" marker-end="url(#rw-h)"/>
  <text class="dg-small" x="760" y="298" text-anchor="middle">observations</text>

  <!-- problems -->
  <rect class="dg-box" x="800.5" y="20.5" width="239" height="330"/>
  <text class="dg-cap on" x="818" y="48">PROBLEM</text>
  <text class="dg-text" x="818" y="74">the real game</text>
  <rect class="c9" x="818" y="102" width="10" height="10"/><text class="dg-title" x="838" y="112">ARC-AGI-3</text>
  <rect class="c14" x="818" y="142" width="10" height="10"/><text class="dg-title" x="838" y="152">PuzzleScript</text>
  <rect class="c7" x="818" y="182" width="10" height="10"/><text class="dg-title" x="838" y="192">Baba Is You</text>
  <rect class="c12" x="818" y="222" width="10" height="10"/><text class="dg-title" x="838" y="232">MiniGrid</text>
  <rect class="c11" x="818" y="262" width="10" height="10"/><text class="dg-title" x="838" y="272">Sokoban</text>
  <text class="dg-small" x="818" y="318">its source is hidden</text>
  <text class="dg-small" x="818" y="335">from the agent</text>

  <!-- record -->
  <path class="dg-line" d="M590 351V386" marker-end="url(#rw-h)"/>
  <path class="dg-line dash" d="M401 440.5H456" marker-end="url(#rw-h)"/>
  <rect class="dg-box" x="460.5" y="390.5" width="579" height="100"/>
  <text class="dg-cap on" x="478" y="418">RUN RECORD</text>
  <text class="dg-text" x="478" y="446">conversation · tool calls · frames · world model</text>
  <text class="dg-small" x="478" y="472">every run is saved and can be replayed in the viewer</text>
</svg>
